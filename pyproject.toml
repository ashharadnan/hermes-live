[project]
name = "hermes-live"
version = "0.1.0"
description = "Local half-duplex-but-interruptible voice assistant on pipecat: Moonshine STT -> OpenAI-compatible LLM -> OpenAI-compatible TTS."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[silero,moonshine,openai,local]==1.12.0",
    "loguru>=0.7,<1",
]

[project.optional-dependencies]
lint = ["ruff>=0.8"]
test = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-timeout>=2.4",
]
profiler = ["line_profiler>=5.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bot", "config"]
packages = ["services"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# The project gate's exact select set -- `ruff check .` and CI agree with it.
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PLW"]